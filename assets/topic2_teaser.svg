<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-label="课题二 Articulation Evidence 输入输出示意图">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0b1730"/><stop offset="1" stop-color="#10162c"/></linearGradient>
    <linearGradient id="panel" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#152541"/><stop offset="1" stop-color="#0e1a31"/></linearGradient>
    <radialGradient id="hot"><stop stop-color="#fb7185"/><stop offset=".46" stop-color="#fbbf24"/><stop offset="1" stop-color="#22d3ee" stop-opacity=".25"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="11" refY="4" orient="auto"><path d="M0,0 L0,8 L12,4 z" fill="#b8c7e4"/></marker>
    <style>.title{font:800 38px Arial,'Noto Sans SC',sans-serif;fill:#f8fbff}.sub{font:400 20px Arial,'Noto Sans SC',sans-serif;fill:#aebbd3}.label{font:800 25px Arial,'Noto Sans SC',sans-serif;fill:#f8fbff}.desc{font:400 17px Arial,'Noto Sans SC',sans-serif;fill:#b9c8e2}.topic{font:800 15px Arial,'Noto Sans SC',sans-serif;fill:#efe8ff}.small{font:700 16px Arial,'Noto Sans SC',sans-serif;fill:#dce7ff}.panelStroke{stroke:rgba(255,255,255,.22);stroke-width:1.2}.line{stroke:#f8fafc;stroke-width:7;stroke-linecap:round;fill:none}.joint{fill:#f8fafc}</style>
  </defs>
  <rect width="1600" height="760" rx="36" fill="url(#bg)"/>
  <circle cx="150" cy="80" r="190" fill="#6ee7f9" opacity=".09"/><circle cx="1410" cy="100" r="220" fill="#a78bfa" opacity=".13"/>
  <text x="60" y="70" class="title">课题二：Class-agnostic Articulation Evidence</text>
  <text x="62" y="112" class="sub">不预设“人类手肘、膝盖”等固定语义，而是在 Gaussian 上学习哪些区域提供关节和骨骼线索。</text>

  <g transform="translate(55 170)">
    <rect width="325" height="500" rx="28" fill="url(#panel)" class="panelStroke"/>
    <text x="28" y="48" class="label">Input</text><text x="28" y="82" class="desc">Gaussian primitives</text>
    <g transform="translate(78 128)" filter="url(#glow)">
      <circle cx="82" cy="52" r="31" fill="#fbbf24"/><circle cx="50" cy="110" r="24" fill="#6ee7f9"/><circle cx="116" cy="110" r="25" fill="#a78bfa"/>
      <circle cx="82" cy="180" r="46" fill="#fb7185"/><circle cx="36" cy="244" r="19" fill="#6ee7f9"/><circle cx="132" cy="244" r="19" fill="#86efac"/>
      <circle cx="22" cy="314" r="13" fill="#fbbf24"/><circle cx="150" cy="314" r="13" fill="#fbbf24"/>
    </g>
    <rect x="28" y="412" width="184" height="34" rx="17" fill="rgba(110,231,249,.16)" stroke="#6ee7f9"/><text x="48" y="435" class="topic">point-based 3D asset</text>
  </g>
  <path d="M396 420 L422 420" stroke="#b8c7e4" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(430 170)">
    <rect width="325" height="500" rx="28" fill="url(#panel)" class="panelStroke"/>
    <text x="28" y="48" class="label">Evidence Head</text><text x="28" y="82" class="desc">每个 primitive 输出结构分数</text>
    <g transform="translate(68 134)">
      <rect x="0" y="0" width="190" height="260" rx="24" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.18)"/>
      <circle cx="95" cy="56" r="34" fill="#a78bfa" opacity=".9"/><rect x="50" y="112" width="90" height="58" rx="16" fill="#6ee7f9" opacity=".9"/><rect x="36" y="198" width="118" height="36" rx="18" fill="#fbbf24" opacity=".95"/>
      <text x="56" y="62" class="small">joint</text><text x="60" y="149" class="small" fill="#06101d">bone</text><text x="54" y="222" class="small" fill="#06101d">uncertainty</text>
    </g>
    <rect x="28" y="412" width="186" height="34" rx="17" fill="rgba(167,139,250,.18)" stroke="#a78bfa"/><text x="48" y="435" class="topic">learned structural cues</text>
  </g>
  <path d="M771 420 L797 420" stroke="#b8c7e4" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(805 170)">
    <rect width="325" height="500" rx="28" fill="url(#panel)" class="panelStroke"/>
    <text x="28" y="48" class="label">Evidence Map</text><text x="28" y="82" class="desc">关节 / 骨骼 / 不确定性</text>
    <g transform="translate(74 124)">
      <circle cx="90" cy="48" r="46" fill="url(#hot)"/><ellipse cx="90" cy="150" rx="54" ry="80" fill="url(#hot)" opacity=".88"/>
      <circle cx="42" cy="200" r="42" fill="url(#hot)" opacity=".92"/><circle cx="138" cy="200" r="42" fill="url(#hot)" opacity=".92"/>
      <circle cx="28" cy="300" r="24" fill="#22d3ee" opacity=".48"/><circle cx="150" cy="300" r="24" fill="#22d3ee" opacity=".48"/>
      <g fill="#fff" opacity=".92"><circle cx="90" cy="48" r="8"/><circle cx="90" cy="132" r="8"/><circle cx="42" cy="200" r="8"/><circle cx="138" cy="200" r="8"/></g>
    </g>
    <rect x="28" y="412" width="214" height="34" rx="17" fill="rgba(251,191,36,.16)" stroke="#fbbf24"/><text x="48" y="435" class="topic">not fixed semantic labels</text>
  </g>
  <path d="M1146 420 L1172 420" stroke="#b8c7e4" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(1180 170)">
    <rect width="325" height="500" rx="28" fill="url(#panel)" class="panelStroke"/>
    <text x="28" y="48" class="label">Downstream</text><text x="28" y="82" class="desc">更稳定的 skeleton / skinning</text>
    <g transform="translate(82 122)">
      <path class="line" d="M85 42 L85 136 M85 102 L30 174 M85 102 L146 174 M85 136 L54 312 M85 136 L126 312"/>
      <circle class="joint" cx="85" cy="42" r="10"/><circle class="joint" cx="85" cy="102" r="10"/><circle class="joint" cx="85" cy="136" r="10"/><circle class="joint" cx="30" cy="174" r="10"/><circle class="joint" cx="146" cy="174" r="10"/><circle class="joint" cx="54" cy="312" r="10"/><circle class="joint" cx="126" cy="312" r="10"/>
      <g opacity=".18" filter="url(#glow)"><circle cx="85" cy="42" r="34" fill="#fbbf24"/><circle cx="85" cy="136" r="55" fill="#fb7185"/><circle cx="30" cy="174" r="25" fill="#6ee7f9"/><circle cx="146" cy="174" r="25" fill="#86efac"/></g>
    </g>
    <rect x="28" y="412" width="220" height="34" rx="17" fill="rgba(134,239,172,.14)" stroke="#86efac"/><text x="48" y="435" class="topic">cross-category rigging</text>
  </g>
</svg>
